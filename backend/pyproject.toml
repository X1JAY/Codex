[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-copy-transcript-backend"
version = "0.1.0"
description = "Local backend scaffold for the Douyin Copy and Transcript Assistant"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "faster-whisper>=1.1,<2",
  "openai>=1.66,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
